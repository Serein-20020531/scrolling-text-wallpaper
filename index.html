<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>自定义滚动文字壁纸</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei", "Noto Serif SC", serif;
      background: #a90000;
    }

    .wallpaper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #a90000;
      background-image:
        radial-gradient(
          circle at 78% 45%,
          rgba(255, 50, 35, 0.35),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.18),
          rgba(255, 0, 0, 0.08)
        );
    }

    /* 左半部分留给桌面图标 */
    .text-area {
      position: absolute;
      top: 0;
      right: 2vw;
      width: 52vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-around;
      gap: 12px;
      pointer-events: none;
    }

    .column {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /*
      每列包含两份完全相同的文字。
      动画只移动第一份文字的高度，因此可以无缝衔接。
    */
    .scroll-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      will-change: transform;
      animation-name: seamlessScroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .scroll-copy {
      flex: 0 0 auto;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
      line-height: 1;
      letter-spacing: 10px;
      color: rgba(255, 240, 230, 0.94);
      font-weight: 700;
      text-shadow: 0 0 18px rgba(255, 210, 190, 0.22);
    }

    @keyframes seamlessScroll {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-50%);
      }
    }

    /* 设置面板 */
    .settings {
      position: fixed;
      z-index: 20;
      top: 20px;
      left: 20px;
      width: 350px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 20px;
      color: #fff;
      background: rgba(25, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .settings.hidden {
      display: none;
    }

    .settings h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .settings label {
      display: block;
      margin: 13px 0 6px;
      font-size: 14px;
    }

    textarea,
    input {
      width: 100%;
      padding: 10px 12px;
      color: #222;
      background: #fff;
      border: none;
      border-radius: 8px;
      outline: none;
      font: inherit;
    }

    textarea {
      height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .hint {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      line-height: 1.5;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .buttons button,
    .open-settings {
      padding: 11px;
      color: #fff;
      background: #d52020;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .buttons button:hover,
    .open-settings:hover {
      background: #ef3030;
    }

    .buttons button.secondary {
      background: rgba(255, 255, 255, 0.16);
    }

    .buttons button.wide {
      grid-column: 1 / -1;
    }

    .open-settings {
      position: fixed;
      z-index: 15;
      top: 20px;
      left: 20px;
      padding: 10px 16px;
      background: rgba(30, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .message {
      min-height: 18px;
      margin: 10px 0 0;
      color: #ffd7c8;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .settings {
        width: calc(100vw - 40px);
      }

      .text-area {
        width: 65vw;
      }
    }
  </style>
</head>

<body>
  <main id="wallpaper" class="wallpaper">
    <section id="textArea" class="text-area"></section>
  </main>

  <button id="openSettings" class="open-settings">
    文字设置
  </button>

  <aside id="settings" class="settings">
    <h2>滚动文字设置</h2>

    <label for="textInput">展示文字</label>

    <textarea
      id="textInput"
      placeholder="每行生成一列文字，例如：
独立思考 明辨是非
自由 鹰击长空
知行合一 保持清醒"
    ></textarea>

    <p class="hint">
      每一行生成一列。文字较短时，系统会自动重复内容，
      保证滚动过程中不会出现整列空白。
    </p>

    <label for="speedInput">
      单轮滚动时间（秒，越小越快）
    </label>

    <input
      id="speedInput"
      type="number"
      min="5"
      max="180"
      value="30"
    >

    <label for="sizeInput">基础字号（像素）</label>

    <input
      id="sizeInput"
      type="number"
      min="18"
      max="130"
      value="58"
    >

    <label for="colorInput">背景颜色</label>

    <input
      id="colorInput"
      type="color"
      value="#a90000"
    >

    <div class="buttons">
      <button id="applyButton">应用并保存</button>
      <button id="hideButton" class="secondary">隐藏面板</button>

      <button id="fullscreenButton" class="secondary">
        全屏预览
      </button>

      <button id="copyLinkButton" class="secondary">
        复制壁纸链接
      </button>

      <button id="resetButton" class="secondary wide">
        恢复默认设置
      </button>
    </div>

    <p id="message" class="message"></p>
  </aside>

  <script>
    const wallpaper = document.getElementById("wallpaper");
    const textArea = document.getElementById("textArea");
    const settings = document.getElementById("settings");
    const textInput = document.getElementById("textInput");
    const speedInput = document.getElementById("speedInput");
    const sizeInput = document.getElementById("sizeInput");
    const colorInput = document.getElementById("colorInput");
    const applyButton = document.getElementById("applyButton");
    const hideButton = document.getElementById("hideButton");
    const openSettings = document.getElementById("openSettings");
    const fullscreenButton =
      document.getElementById("fullscreenButton");
    const copyLinkButton =
      document.getElementById("copyLinkButton");
    const resetButton =
      document.getElementById("resetButton");
    const message = document.getElementById("message");

    const defaultText = [
      "独立思考 明辨是非",
      "自由 鹰击长空",
      "知行合一 保持清醒",
      "雄关漫道真如铁",
      "而今迈步从头越"
    ].join("\n");

    const params = new URLSearchParams(window.location.search);
    const isWallpaperMode = params.get("wallpaper") === "1";

    function showMessage(text) {
      message.textContent = text;

      window.clearTimeout(showMessage.timer);

      showMessage.timer = window.setTimeout(() => {
        message.textContent = "";
      }, 4000);
    }

    function loadSettings() {
      textInput.value =
        params.get("text") ||
        localStorage.getItem("wallpaperText") ||
        defaultText;

      speedInput.value =
        params.get("speed") ||
        localStorage.getItem("wallpaperSpeed") ||
        30;

      sizeInput.value =
        params.get("size") ||
        localStorage.getItem("wallpaperSize") ||
        58;

      colorInput.value =
        params.get("color") ||
        localStorage.getItem("wallpaperColor") ||
        "#a90000";
    }

    function saveSettings() {
      localStorage.setItem(
        "wallpaperText",
        textInput.value
      );

      localStorage.setItem(
        "wallpaperSpeed",
        speedInput.value
      );

      localStorage.setItem(
        "wallpaperSize",
        sizeInput.value
      );

      localStorage.setItem(
        "wallpaperColor",
        colorInput.value
      );
    }

    /*
      根据文字长度与屏幕高度，自动重复内容。
      每一份文字都至少比屏幕稍长，避免中途露出空白。
    */
    function createRepeatedText(line, fontSize) {
      const cleanLine = line.trim() || "请输入展示文字";
      const estimatedCharacterHeight = fontSize + 10;
      const estimatedLineHeight =
        Math.max(1, cleanLine.length) *
        estimatedCharacterHeight;

      const requiredHeight = window.innerHeight * 1.25;

      const repeatCount = Math.max(
        2,
        Math.ceil(requiredHeight / estimatedLineHeight) + 1
      );

      return Array(repeatCount)
        .fill(cleanLine)
        .join("　") + "　";
    }

    function createColumn(line, index, speed, baseSize) {
      const column = document.createElement("div");
      column.className = "column";

      const track = document.createElement("div");
      track.className = "scroll-track";

      /*
        使用固定规律而不是每次完全随机，
        避免点击“应用”后排版突然剧烈变化。
      */
      const sizeFactors = [1, 0.82, 1.16, 0.92, 1.08, 0.76];
      const opacityFactors = [0.96, 0.66, 0.88, 0.72, 1, 0.58];

      const fontSize =
        baseSize * sizeFactors[index % sizeFactors.length];

      const opacity =
        opacityFactors[index % opacityFactors.length];

      const repeatedText =
        createRepeatedText(line, fontSize);

      /*
        创建两份完全相同的文字。
        当第一份滚出屏幕后，第二份正好接上。
      */
      for (let copyIndex = 0; copyIndex < 2; copyIndex++) {
        const copy = document.createElement("div");
        copy.className = "scroll-copy";
        copy.textContent = repeatedText;
        copy.style.fontSize = `${fontSize}px`;
        copy.style.opacity = opacity;

        track.appendChild(copy);
      }

      track.style.animationDuration =
        `${speed + index * 2.5}s`;

      track.style.animationDelay =
        `${-(index * 3.5)}s`;

      column.appendChild(track);

      return column;
    }

    function renderWallpaper() {
      const lines = textInput.value
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);

      const finalLines =
        lines.length > 0
          ? lines
          : ["请输入展示文字"];

      const speed = Math.min(
        180,
        Math.max(5, Number(speedInput.value) || 30)
      );

      const size = Math.min(
        130,
        Math.max(18, Number(sizeInput.value) || 58)
      );

      const backgroundColor =
        colorInput.value || "#a90000";

      speedInput.value = speed;
      sizeInput.value = size;

      textArea.innerHTML = "";

      finalLines.forEach((line, index) => {
        textArea.appendChild(
          createColumn(line, index, speed, size)
        );
      });

      document.body.style.backgroundColor =
        backgroundColor;

      wallpaper.style.backgroundColor =
        backgroundColor;
    }

    function buildWallpaperLink() {
      const url = new URL(window.location.href);

      url.search = "";

      url.searchParams.set("wallpaper", "1");
      url.searchParams.set("text", textInput.value);
      url.searchParams.set("speed", speedInput.value);
      url.searchParams.set("size", sizeInput.value);
      url.searchParams.set("color", colorInput.value);

      return url.toString();
    }

    async function copyWallpaperLink() {
      saveSettings();
      renderWallpaper();

      const link = buildWallpaperLink();

      try {
        await navigator.clipboard.writeText(link);

        showMessage(
          "壁纸链接已复制，可粘贴到 Lively Wallpaper。"
        );
      } catch (error) {
        window.prompt(
          "请复制下面的壁纸链接：",
          link
        );
      }
    }

    applyButton.addEventListener("click", () => {
      saveSettings();
      renderWallpaper();
      showMessage("设置已经保存。");
    });

    hideButton.addEventListener("click", () => {
      settings.classList.add("hidden");
    });

    openSettings.addEventListener("click", () => {
      settings.classList.remove("hidden");
    });

    fullscreenButton.addEventListener("click", async () => {
      saveSettings();
      renderWallpaper();
      settings.classList.add("hidden");

      try {
        await document.documentElement.requestFullscreen();
      } catch (error) {
        showMessage("浏览器阻止了全屏，请按 F11。");
      }
    });

    copyLinkButton.addEventListener(
      "click",
      copyWallpaperLink
    );

    resetButton.addEventListener("click", () => {
      textInput.value = defaultText;
      speedInput.value = 30;
      sizeInput.value = 58;
      colorInput.value = "#a90000";

      saveSettings();
      renderWallpaper();
      showMessage("已经恢复默认设置。");
    });

    let resizeTimer;

    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);

      resizeTimer = window.setTimeout(() => {
        renderWallpaper();
      }, 200);
    });

    loadSettings();
    renderWallpaper();

    /*
      带 wallpaper=1 的链接会自动进入纯壁纸模式，
      不显示任何设置按钮。
    */
    if (isWallpaperMode) {
      settings.classList.add("hidden");
      openSettings.style.display = "none";
    }
  </script>
</body>
</html>
